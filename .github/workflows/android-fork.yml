name: Build fork Android APK
run-name: Build fork Android APK

on:
  workflow_dispatch:
    inputs:
      android_abi:
        description: Phone architecture
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, armeabi-v7a, x86_64]
      publish_release:
        description: Publish the APK through the automated release workflow
        type: boolean
        default: false
      source_run_id:
        description: Reuse a successful ARM64 build run instead of rebuilding
        type: string
        default: ''
      release_tag:
        description: Existing version tag to publish
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  android:
    if: ${{ !inputs.source_run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      FORK_ANDROID_ABI: ${{ inputs.android_abi || 'arm64-v8a' }}
      FORK_SIGNING_SHA256: 6db7d944002ffc1a5fe2e33f0f186877355251a4184ca55512dac3c722fdc1b7
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      # Reuse the fork's development key for subsequent builds.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fork-signing
          key: android-fork-signing-v1-${{ github.repository_id }}

      - name: Prepare fork signing
        env:
          FORK_KEY_DIR: ${{ runner.temp }}/fork-signing
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$FORK_KEY_DIR"
          if [ -n "$FORK_KEYSTORE_BASE64" ]; then
            printf '%s' "$FORK_KEYSTORE_BASE64" | base64 --decode > "$FORK_KEY_DIR/fork.jks"
          fi
          test -f "$FORK_KEY_DIR/fork.jks" || { echo 'Restore the existing fork signing key before building'; exit 1; }
          certificate_sha="$(keytool -exportcert -keystore "$FORK_KEY_DIR/fork.jks" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          test "$certificate_sha" = "$FORK_SIGNING_SHA256"
          cat > android/key.properties <<EOF
          storeFile=$FORK_KEY_DIR/fork.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Configure fork identity and phone architecture
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          abi = os.environ['FORK_ANDROID_ABI']
          platforms = {
              'arm64-v8a': 'android-arm64',
              'armeabi-v7a': 'android-arm',
              'x86_64': 'android-x64',
          }
          assert abi in platforms
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'FORK_ANDROID_PLATFORM={platforms[abi]}\n')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          replacements = [
              (': "com.github.wgh136.venera.prime"', ': "com.github.zklall.venera.prime"', 1),
              ("include 'armeabi-v7a', 'arm64-v8a', 'x86_64'", f"include '{abi}'", 1),
              ('universalApk true', 'universalApk false', 1),
              # ABI splits select the architecture; NDK filters conflict with them.
              ('abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"', '', 2),
          ]
          for old, new, count in replacements:
              assert text.count(old) == count, old
              text = text.replace(old, new)
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          assert manifest.read_text().count('android:label="Venera Z"') == 1
          PY

      - name: Set up Rust toolchain
        run: rustup show

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build phone release APK
        run: flutter build apk --release --target-platform "$FORK_ANDROID_PLATFORM" --split-per-abi

      - name: Verify APKs and record build details
        run: |
          set -euo pipefail
          apksigner_path="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          aapt_path="$(dirname "$apksigner_path")/aapt"
          output_dir=build/app/outputs/apk/release
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          apks = list(Path('build/app/outputs/apk/release').glob('*.apk'))
          assert len(apks) == 1, apks
          with zipfile.ZipFile(apks[0]) as apk:
              abis = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
          assert abis == {os.environ['FORK_ANDROID_ABI']}, abis
          print('Verified single APK and requested native architecture:', abis)
          PY
          python3 tool/check_android_type_signatures.py "$output_dir"/*.apk
          api_jar=build/mihon-runtime/intermediates/runtime_library_classes_jar/release/bundleLibRuntimeToJarRelease/classes.jar
          if [ ! -f "$api_jar" ]; then
            (cd android && ./gradlew :mihon-runtime:bundleLibRuntimeToJarRelease)
          fi
          python3 tool/check_mihon_api.py "$api_jar" "$output_dir"/*.apk
          {
            echo "Source commit: $GITHUB_SHA"
            echo 'Application: Venera Z'
            echo 'Package: com.github.zklall.venera.prime'
            echo 'Signed with an independent fork development key.'
            echo 'Install alongside Venera Prime; app data is separate.'
            for apk in "$output_dir"/*.apk; do
              echo
              basename "$apk"
              "$apksigner_path" verify --print-certs "$apk"
              "$aapt_path" dump badging "$apk" | sed -n '1p;/^application-label:/p'
              sha256sum "$apk"
            done
          } | tee "$output_dir/build-info.txt"
          cat "$output_dir/build-info.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-fork-${{ env.FORK_ANDROID_ABI }}-apk
          path: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/apk/release/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Start automated fork release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$FORK_ANDROID_ABI" = arm64-v8a
          test -n "$FORK_RELEASE_TAG"
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$FORK_RELEASE_TAG" \
            -f build_macos=false -f build_ios=false -f build_android=false \
            -f build_windows=false -f build_linux=false -f build_linux_arm64=false \
            -f publish_release=true -f allow_personal_trigger=false \
            -f release_tag="$FORK_RELEASE_TAG" -f fork_android_run_id="$GITHUB_RUN_ID"

  publish_existing:
    if: ${{ inputs.publish_release && inputs.source_run_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Publish an existing verified ARM64 build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          FORK_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$FORK_RELEASE_TAG"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FORK_SOURCE_RUN_ID")"
          test "$(jq -r .head_sha <<< "$run")" = "$GITHUB_SHA"
          test "$(jq -r .path <<< "$run")" = '.github/workflows/android-fork.yml'
          test "$(jq -r .conclusion <<< "$run")" = success
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$FORK_RELEASE_TAG" \
            -f build_macos=false -f build_ios=false -f build_android=false \
            -f build_windows=false -f build_linux=false -f build_linux_arm64=false \
            -f publish_release=true -f allow_personal_trigger=false \
            -f release_tag="$FORK_RELEASE_TAG" -f fork_android_run_id="$FORK_SOURCE_RUN_ID"
