name: Attach verified Android APK
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-22.04
    steps:
      - name: Check build commit against release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$(jq -r .head_sha <<< "$run")" = "$tag_sha"
          test "$(jq -r .path <<< "$run")" = '.github/workflows/android-fork.yml'
          test "$(jq -r .conclusion <<< "$run")" = success
      - uses: actions/download-artifact@v4
        with:
          name: android-fork-arm64-v8a-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          path: outputs
      - name: Attach APK to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" outputs/*.apk --repo "$GITHUB_REPOSITORY" --clobber
